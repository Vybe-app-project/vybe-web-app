<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>You're offline · Vybe</title>
    <style>
      :root { color-scheme: light; --bg: #ffffff; --surface: #ffffff; --line: #dbdbdb; --text-1: #000000; --text-2: #666666; --brand: #0077d9; --on-brand: #ffffff; }
      /* Dark: the stored in-app choice (set by /offline.js) wins; the system
         preference applies only when the script did not run. */
      html[data-theme="dark"] { color-scheme: dark; --bg: #000000; --surface: #1a1a1a; --line: rgba(255,255,255,.1); --text-1: #f5f5f5; --text-2: #a8a8a8; --brand: #0077d9; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { color-scheme: dark; --bg: #000000; --surface: #1a1a1a; --line: rgba(255,255,255,.1); --text-1: #f5f5f5; --text-2: #a8a8a8; --brand: #0077d9; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text-1); font: 16px/1.5 -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: 100%; max-width: 26rem; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 40px 24px 28px; }
      svg { display: block; margin: 0 auto 20px; color: var(--brand); }
      h1 { margin: 0 0 8px; font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--text-2); }
      .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
      button, .link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
      button { background: var(--brand); color: var(--on-brand); }
      .link { color: var(--text-2); }
      .link:hover { text-decoration: underline; text-underline-offset: 3px; }
      button:focus-visible, .link:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
        <circle cx="6.3" cy="4.9" r="1.9" fill="currentColor"/>
        <circle cx="17.7" cy="4.9" r="1.9" fill="currentColor"/>
        <path d="M 3.9 9.2 L 12 20.6 L 20.1 9.2" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 9.1 16.5 L 12 9.1 L 14.9 16.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>You're offline</h1>
      <p>Vybe needs a connection for this page. Anything you already opened is still available, and this page reloads by itself when you're back online.</p>
      <div class="actions">
        <button type="button" id="retry">Try again</button>
        <a class="link" href="/">Back to Vybe</a>
      </div>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
