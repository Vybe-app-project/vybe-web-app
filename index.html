<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vybe | Contact Us</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #fff;
    }

    .container {
        background: #ffffff;
        color: #1e293b;
        width: 100%;
        max-width: 500px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
        text-align: center;
        margin-bottom: 10px;
        font-size: 28px;
        font-weight: bold;
        color: #00D4AA;
    }

    .subtitle {
        text-align: center;
        margin-bottom: 25px;
        font-size: 14px;
        color: #64748b;
    }

    form {
        display: flex;
        flex-direction: column;
    }

    label {
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 14px;
    }

    input, textarea {
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        margin-bottom: 18px;
        font-size: 14px;
        transition: 0.3s ease;
    }

    input:focus, textarea:focus {
        border-color: #00D4AA;
        outline: none;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    textarea {
        resize: none;
        min-height: 120px;
    }

    button {
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #00D4AA;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
    }

    button:hover {
        background: #00D4AA;
    }

    .contact-email {
        margin-top: 20px;
        text-align: center;
        font-size: 13px;
        color: #64748b;
    }

    .success {
        color: green;
        text-align: center;
        margin-top: 15px;
        font-weight: 600;
    }

    .error {
        color: red;
        text-align: center;
        margin-top: 15px;
        font-weight: 600;
    }
</style>
</head>

<body>

<div class="container">
    <div class="logo">Vybe</div>
    <div class="subtitle">We’d love to hear from you</div>

    <form id="contactForm">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required />

        <label for="email">Email Address</label>
        <input type="email" id="email" required />

        <label for="message">Your Message</label>
        <textarea id="message" required></textarea>

        <button type="submit">Send Message</button>

        <div id="responseMessage"></div>
    </form>

    <div class="contact-email">
        Or contact us directly at <br />
        <strong>charlie.pearsall1@gmail.com</strong>
    </div>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();
    const responseDiv = document.getElementById("responseMessage");

    responseDiv.innerHTML = "";

    try {
        const response = await fetch("https://vybeapi-ea0a457b2f93.herokuapp.com/api/support/message", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fullName,
                email,
                message
            })
        });

        const data = await response.json();

        if (response.ok) {
            responseDiv.innerHTML = "<div class='success'>Message sent successfully! We'll get back to you soon.</div>";
            document.getElementById("contactForm").reset();
        } else {
            responseDiv.innerHTML = "<div class='error'>Something went wrong. Please try again.</div>";
        }

    } catch (error) {
        responseDiv.innerHTML = "<div class='error'>Server error. Please try again later.</div>";
    }
});
</script>

</body>
</html>
